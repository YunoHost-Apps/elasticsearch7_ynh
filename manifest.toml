#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "elasticsearch7"
name = "ElasticSearch 7"
description.en = "Distributed and RESTful search engine"
description.fr = "Moteur de recherche RESTful"

version = "9.2.3~ynh1"

maintainers = ["fflorent"]

[upstream]
license = "SSPL-1.0"
website = "https://elastic.co"
demo = "https://www.elastic.co/demos"
admindoc = "https://www.elastic.co/guide/en/elasticsearch/reference/7.17/elasticsearch-intro.html"
code = "https://github.com/elastic/elasticsearch"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

[resources]
    [resources.sources.main]
    arm64.url = "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-9.2.3-linux-aarch64.tar.gz"
    arm64.sha256 = "63776a188d1ff7c963f8f48062a8bccf5d50657fc122f692809b365900b1c26c"
    amd64.url = "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-9.2.3-linux-x86_64.tar.gz"
    amd64.sha256 = "beb8793d30d6e5f6f49fa0e9f1a9d9b01a7eb7ecd535b494c38492f9e1111275"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]

    [resources.ports]
    main.default = 9200
